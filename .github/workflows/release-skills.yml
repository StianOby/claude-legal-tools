name: Release Skills

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build tag
        id: tag
        run: |
          COMMIT_NUM=$(git rev-list --count HEAD)
          echo "value=skills-$(date +'%Y.%m.%d')-${COMMIT_NUM}" >> $GITHUB_OUTPUT

      - name: Build changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --list 'skills-*' --sort=-creatordate | head -n1)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
            echo "Commits since ${PREV_TAG}:"
          else
            RANGE="HEAD"
            echo "All commits (no previous release found):"
          fi
          {
            echo "body<<CHANGELOG_EOF"
            if [ -n "$PREV_TAG" ]; then
              echo "### Changes since ${PREV_TAG}"
            else
              echo "### Changes"
            fi
            echo ""
            git log --no-merges --pretty=format:'- %s (%h)' "$RANGE"
            echo ""
            echo "CHANGELOG_EOF"
          } >> $GITHUB_OUTPUT

      - name: Package skills
        run: |
          for skill_dir in skills/*/; do
            skill=$(basename "$skill_dir")
            (cd "$skill_dir" && zip -r "../../${skill}.zip" .)
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: ${{ steps.tag.outputs.value }}
          body: ${{ steps.changelog.outputs.body }}
          files: "*.zip"
