name: Validate plugins

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, so the tests also meet each new upstream release (the next step
  # installs the newest versions) before Dependabot's 14-day cooldown
  # proposes it: pypdf 7.0.0 broke nbno that way (2026-11-09).
  schedule:
    - cron: "17 5 * * 1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check that changed plugins have a bumped version
        if: github.event_name != 'schedule'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base=$(git tag --list 'skills-*' --sort=-creatordate | head -n1)
            [ -n "$base" ] || base="${{ github.event.before }}"
          fi
          echo "comparing against $base"
          .github/scripts/check-plugin-versions.sh "$base"

      - name: Check data snapshot age (warning only, see CLAUDE.md)
        run: .github/scripts/snapshots.py check || true

      # On the newest upstream versions, deliberately unpinned: the early
      # warning. The "pinned" job below tests what the skills install.
      - name: Run script unit tests (no network, newest dependency versions)
        run: |
          pip install --quiet openpyxl Pillow pypdf pikepdf numpy
          for t in tests/*/test_*.py; do
            [ -e "$t" ] || continue
            echo "== $t"
            python3 "$t"
          done
          echo "== shared/local-route/test_pack.py"
          python3 shared/local-route/test_pack.py

      - name: Check shared files are identical in every plugin that carries them
        run: python3 .github/scripts/check-shared.py

      # The runner's python3 is not 3.13 (3.14 on 2026-11-09), so this takes
      # the uv path the Cowork local VM (Python 3.10) takes: network, ~35 MB,
      # a few seconds.
      - name: local_python.sh provides a Python 3.13 without root (network)
        run: |
          py=$(bash shared/local-route/local_python.sh /tmp/lp)
          "$py" -c "import sys; print(sys.version); assert sys.version_info[:2] == (3, 13)"
          if ! command -v python3.13 >/dev/null && ! python3 -c "import sys; sys.exit(sys.version_info[:2] != (3, 13))"; then
            case "$py" in /tmp/lp/*) ;; *) echo "::error::uv's Python not under the run directory: $py"; exit 1;; esac
          fi

      - name: Check SKILL.md description length (≤ 1024 chars after YAML parsing)
        run: |
          pip install --quiet pyyaml
          fail=0
          for f in plugins/*/skills/*/SKILL.md; do
            n=$(python3 -c "
          import yaml, sys
          text = open(sys.argv[1]).read()
          fm = text.split('---', 2)[1]
          print(len(yaml.safe_load(fm)['description']))
          " "$f")
            if [ "$n" -gt 1024 ]; then
              echo "::error file=$f::description is $n chars (max 1024)"
              fail=1
            else
              echo "$f: $n"
            fi
          done
          exit $fail

      - name: Check every plugin has a marketplace entry and vice versa
        run: |
          python3 - <<'PY'
          import json, os, sys
          m = json.load(open(".claude-plugin/marketplace.json"))
          listed = {p["name"] for p in m["plugins"]}
          on_disk = {d for d in os.listdir("plugins") if os.path.isdir(f"plugins/{d}")}
          for p in m["plugins"]:
              assert p["source"] == f"./plugins/{p['name']}", p
              pj = json.load(open(f"plugins/{p['name']}/.claude-plugin/plugin.json"))
              assert pj["name"] == p["name"], p
              assert "version" not in p, f"{p['name']}: version belongs in plugin.json only"
          missing = on_disk - listed
          extra = listed - on_disk
          if missing or extra:
              print("not in marketplace.json:", sorted(missing))
              print("not on disk:", sorted(extra))
              sys.exit(1)
          print("marketplace entries OK:", sorted(listed))
          PY

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run browser-helper unit tests (no network, no npm packages)
        run: |
          for t in tests/*/test_*.js; do
            [ -e "$t" ] || continue
            echo "== $t"
            node "$t"
          done

      - name: Run eu-agreements-treaties parser tests (Node + linkedom)
        working-directory: tests/eu-agreements-treaties
        run: |
          npm ci --no-audit --no-fund
          node run.js
          echo "== again, on the copy shared/browser-paste/paste.py makes"
          node -r ../browser-helpers/stripped_preload.js run.js
          echo "== lovdata-pro toText() on a DOM (uses the same linkedom)"
          node ../lovdata-pro/dom.js
          echo "== lovdata-pro new-Pro (pro2) backend on a DOM"
          node ../lovdata-pro/pro2.js

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace manifest
        run: claude plugin validate .

      - name: Validate plugin manifests
        run: |
          for p in plugins/*/; do
            claude plugin validate "$p" --strict
          done

  # What users get: each lock file (plugins/*/skills/*/scripts/requirements.txt)
  # installed on Python 3.13, the cloud sandbox's (the local route gets the
  # same from local_python.sh), and that plugin's tests run on it. A
  # Dependabot PR whose pins fail here is not merged.
  pinned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run each plugin's tests on its pinned versions
        run: |
          for lock in plugins/*/skills/*/scripts/requirements.txt; do
            p=$(echo "$lock" | cut -d/ -f2)
            echo "::group::$p ($lock)"
            python -m venv "/tmp/venv-$p"
            "/tmp/venv-$p/bin/pip" install --quiet -r "$lock"
            for t in tests/$p/test_*.py; do
              [ -e "$t" ] || continue
              echo "== $t"
              "/tmp/venv-$p/bin/python" "$t"
            done
            echo "::endgroup::"
          done
